<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HACKED SYSTEM</title>
    <style>
        @keyframes blink { 50% { opacity: 0; } }
        @keyframes shake { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(-5px, 5px); } 50% { transform: translate(5px, -5px); } 75% { transform: translate(-5px, 5px); } }
        @keyframes glitch { 0% { transform: skewX(0deg); } 20% { transform: skewX(-10deg); } 40% { transform: skewX(10deg); } 60% { transform: skewX(-10deg); } 80% { transform: skewX(10deg); } 100% { transform: skewX(0deg); } }
        @keyframes flicker { 0%, 20%, 40%, 60%, 80%, 100% { opacity: 1; } 10%, 30%, 50%, 70%, 90% { opacity: 0; } }
        body { background: black; color: lime; font-family: monospace; padding: 20px; overflow: hidden; transition: 0.1s; }
        #terminal { white-space: pre-wrap; height: 90vh; overflow-y: auto; display: flex; flex-direction: column; justify-content: flex-start; animation: flicker 0.2s infinite; }
        .cursor { display: inline-block; width: 8px; height: 16px; background-color: lime; animation: blink 0.6s infinite; }
        .glitch { display: inline-block; animation: glitch 0.2s infinite; }
        .warning { color: red; animation: blink 0.3s infinite; }
        .shake { animation: shake 0.2s infinite; }
        .explosion { background: red; transition: 0.1s; }
        .window { width: 80%; margin: 20px auto; padding: 10px; background: rgba(0, 0, 0, 0.8); border-radius: 10px; box-shadow: 0 0 15px rgba(0, 255, 0, 0.7); border: 2px solid lime; position: relative; animation: flicker 0.3s infinite; }
        .window-header { font-size: 18px; font-weight: bold; color: lime; padding: 5px; cursor: pointer; }
        .window-content { color: white; margin-top: 10px; font-size: 14px; }
        .close-btn { position: absolute; top: 5px; right: 10px; color: red; cursor: pointer; font-size: 20px; }
        /* Background animation */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://www.transparenttextures.com/patterns/black-paper.png');
            z-index: -1;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div id="terminal"></div>
    <script>
        let isFullScreen = false;
        let altPressed = false;

        function enterFullScreen() {
            if (!document.fullscreenElement && !isFullScreen) {
                document.documentElement.requestFullscreen();
                isFullScreen = true;
            }
        }

        function exitFullScreen() {
            if (document.exitFullscreen) { 
                document.exitFullscreen(); 
            }
            isFullScreen = false;
        }

        function stopFullScreenOnAlt() {
            window.addEventListener('keydown', function(event) {
                if (event.key === 'Alt' || event.key === 'AltGraph') {
                    altPressed = true;
                    if (isFullScreen) exitFullScreen();
                }
            });
            window.addEventListener('keyup', function(event) {
                if (event.key === 'Alt' || event.key === 'AltGraph') {
                    altPressed = false;
                }
            });
        }

        function keepTryingFullScreen() {
            setInterval(() => {
                if (!document.fullscreenElement && !isFullScreen && !altPressed) {
                    enterFullScreen();
                }
            }, 1000);
        }

        function startFullScreenLoop() {
            setInterval(() => {
                enterFullScreen();
            }, 500);
        }

        document.addEventListener('DOMContentLoaded', () => {
            enterFullScreen();
            startFullScreenLoop();
            stopFullScreenOnAlt();
        });

        const terminal = document.getElementById("terminal");
        const commands = [
"█ INICIALIZANDO SISTEMA █", 
    "█ CONECTANDO À DARKNET █", 
    "█ BYPASSANDO FIREWALL █", 
    "█ INFILTRANDO MAINFRAME █", 
    " EXTRAINDO DADOS SIGILOSOS ", 
    " SOBRESCREVENDO ARQUIVOS ", 
    " DESCRIPTOGRAFANDO CÓDIGOS SECRETOS ", 
    " VÍRUS ATIVADO ", 
    " SEQUÊNCIA DE AUTODESTRUIÇÃO INICIADA ", 
    "<span class='warning'>█ ALERTA: CONTRA-ATAQUE DETECTADO █</span>", 
    "<span class='warning'>█ A.I. DEFENSIVA ATIVADA █</span>", 
    "<span class='warning'>█ REVERSÃO DE ATAQUE EM ANDAMENTO █</span>", 
    "<span class='warning'>█ ALERTA: CONTROLE DO SISTEMA PERDIDO █</span>", 
    "<span class='warning'>█ CONTAGEM REGRESSIVA: 5 █</span>", 
    "<span class='warning'>█ CONTAGEM REGRESSIVA: 4 █</span>", 
    "<span class='warning'>█ CONTAGEM REGRESSIVA: 3 █</span>", 
    "<span class='warning'>█ CONTAGEM REGRESSIVA: 2 █</span>", 
    "<span class='warning'>█ CONTAGEM REGRESSIVA: 1 █</span>", 
    "<span class='warning'>█ ERRO CRÍTICO: CONTROLE COMPROMETIDO █</span>", 
    "<span class='warning'>█ EXPLOIT REVERTIDO █</span>", 
    "<span class='warning'>█ SEGURANÇA REFORÇADA █</span>", 
    "<span class='warning'>█ ACESSO NEGADO █</span>", 
    "<span class='warning'>█ DESCONECTANDO FORÇADAMENTE █</span>"
        ];
        
        function typeText(text, speed, callback) { 
            let i = 0; 
            const line = document.createElement("div"); 
            terminal.appendChild(line); 
            function type() { 
                if (i < text.length) { 
                    line.innerHTML += Math.random() < 0.1 ? `<span class="glitch">${text.charAt(i)}</span>` : text.charAt(i); 
                    i++; 
                    setTimeout(type, speed); 
                } else { 
                    line.innerHTML += '<span class="cursor"></span>'; 
                    setTimeout(() => { 
                        line.removeChild(line.lastChild); 
                        callback(); 
                    }, 300); 
                } 
            } 
            type(); 
        }

        function triggerAlert(callback) { 
            document.body.classList.add("shake"); 
            setTimeout(() => { 
                document.body.classList.remove("shake"); 
                callback(); 
            }, 1500); 
        }

        function countdownExplosion(callback) { 
            let countdown = 5; 
            function update() { 
                if (countdown === 0) { 
                    document.body.classList.add("explosion"); 
                    setTimeout(() => { 
                        document.body.innerHTML = "<h1 style='color: red; text-align: center;'>💀 SYSTEM DESTROYED 💀</h1>"; 
                    }, 300); 
                } else { 
                    typeText(`<span class='warning'>█ COUNTDOWN: ${countdown} █</span>`, 30, () => { 
                        countdown--; 
                        setTimeout(update, 800); 
                    }); 
                } 
            } 
            update(); 
        }

        function createWindow(title, content) { 
            const window = document.createElement("div"); 
            window.className = "window"; 
            const header = document.createElement("div"); 
            header.className = "window-header"; 
            header.textContent = title; 
            window.appendChild(header); 
            const closeBtn = document.createElement("div"); 
            closeBtn.className = "close-btn"; 
            closeBtn.textContent = "X"; 
            closeBtn.onclick = () => window.remove(); 
            window.appendChild(closeBtn); 
            const body = document.createElement("div"); 
            body.className = "window-content"; 
            body.innerHTML = content; 
            window.appendChild(body); 
            document.body.appendChild(window); 
        }

        function runCommands() { 
            if (commands.length > 0) { 
                let command = commands.shift(); 
                if (command.includes("WARNING") || command.includes("AUTO-DESTRUCT")) { 
                    triggerAlert(runCommands); 
                } else if (command.includes("COUNTDOWN")) { 
                    countdownExplosion(); 
                } else { 
                    typeText("> " + command, 30, () => { 
                        terminal.scrollTop = terminal.scrollHeight; 
                        setTimeout(runCommands, 400); 
                    }); 
                } 
            } 
        }

        runCommands(); 
        createWindow("Security Alert", "Suspicious activity detected. Attempting to override...");
    </script>
</body>
</html>
